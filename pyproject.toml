[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langparse"
version = "0.0.1"
description = "LangParse is a universal document parsing and text chunking engine for LLM or agent applications — Documents In, Knowledge Out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "syw2014", email = "syw2014@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]

keywords = ["llm", "rag", "parsing", "chunking", "agent", "document-parsing"]

# Zero required dependencies: install only the extras your formats need.
dependencies = []

[project.scripts]
langparse = "langparse.cli:main"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10.0"]
docx = ["python-docx>=1.1.0"]
excel = ["pandas>=2.0.0", "openpyxl>=3.1.0"]
# OCR fallback lives in the PDF engine, so it needs the PDF stack to be useful.
# pdfplumber already pulls in pypdfium2, which rasterises the page.
ocr = ["rapidocr_onnxruntime>=1.3.0", "pdfplumber>=0.10.0"]
mineru = ["mineru[all]"]
all = ["pdfplumber", "python-docx", "pandas", "openpyxl", "rapidocr_onnxruntime", "mineru[all]"]
# The test suite exercises every parser, and conftest.py builds .docx/.xlsx
# fixtures at import time, so `pip install -e ".[dev]"` must be enough to run it.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/syw2014/langparse"
Repository = "https://github.com/syw2014/langparse"
Issues = "https://github.com/syw2014/langparse/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langparse*"]

[tool.setuptools.package-data]
# Ships the marker so downstream type checkers honour our annotations.
langparse = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in argument default: intentional for `length_function=len`
]

[tool.ruff.lint.per-file-ignores]
# Tests define throwaway classes and shadow names freely.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
