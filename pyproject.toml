[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langparse"
version = "0.1.0rc1"
description = "LangParse is a universal document parsing and text chunking engine for LLM or agent applications — Documents In, Knowledge Out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "syw2014", email = "syw2014@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]

keywords = ["llm", "rag", "parsing", "chunking", "agent", "document-parsing"]

# Zero required dependencies: install only the extras your formats need.
dependencies = []

[project.scripts]
langparse = "langparse.cli:main"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11.10"]
docx = ["python-docx>=1.1.0"]
excel = ["pandas>=2.0.0", "openpyxl>=3.1.0"]
model = ["openai>=2.0.0,<3.0.0"]
# OCR fallback lives in the PDF engine, so it needs the PDF stack to be useful.
# pdfplumber already pulls in pypdfium2, which rasterises the page.
ocr = ["rapidocr_onnxruntime>=1.3.0", "pdfplumber>=0.11.10"]
# Remote MinerU needs no extra. This installs the API/orchestration package only;
# operators choose an official backend extra separately for local inference.
mineru = ["mineru>=3.4,<4"]
deepdoc = [
    "pdfplumber>=0.11.10",
    "opencv-python-headless>=4.9.0",
    "onnxruntime>=1.17.0",
    "pypdf>=6.15.0",
    "huggingface_hub>=0.20.0",
    "scikit-learn>=1.3.0",
    "shapely>=2.0.0",
    "pyclipper>=1.3.0",
    "jieba>=0.42.1",
]
all = ["pdfplumber>=0.11.10", "python-docx", "pandas", "openpyxl", "openai>=2.0.0,<3.0.0", "rapidocr_onnxruntime", "mineru>=3.4,<4", "opencv-python-headless", "onnxruntime", "pypdf>=6.15.0", "huggingface_hub", "scikit-learn", "shapely", "pyclipper", "jieba"]
# The test suite exercises every parser, and conftest.py builds .docx/.xlsx
# fixtures at import time, so `pip install -e ".[dev]"` must be enough to run it.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "openai>=2.0.0,<3.0.0",
    "tabulate>=0.9.0",
    "jieba>=0.42.1",
]

[project.urls]
Homepage = "https://github.com/syw2014/langparse"
Repository = "https://github.com/syw2014/langparse"
Issues = "https://github.com/syw2014/langparse/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langparse*"]

[tool.setuptools.package-data]
# Ships the marker so downstream type checkers honour our annotations.
langparse = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in argument default: intentional for `length_function=len`
]

[tool.ruff.lint.per-file-ignores]
# Tests define throwaway classes and shadow names freely.
"tests/*" = ["B011"]
# Vendored from RAGFlow's deepdoc (Apache-2.0) — ported near-verbatim, see
# langparse/engines/pdf/deepdoc/__init__.py for provenance. Not rewritten to
# local style; only cross-package imports and out-of-scope branches changed.
"langparse/engines/pdf/deepdoc/*" = ["E", "F403", "F405", "B", "UP", "C4", "I"]

# Exclude vendored deepdoc files from ruff format to preserve upstream diffability.
# These 8 files are ported near-verbatim from RAGFlow (Apache-2.0) and must remain
# diffable against future upstream changes — not part of the project's normal style
# migration. Per-file-ignore only applies to linting; this section excludes them from
# formatting as well, which is a separate ruff configuration surface.
[tool.ruff.format]
exclude = [
    "langparse/engines/pdf/deepdoc/operators.py",
    "langparse/engines/pdf/deepdoc/postprocess.py",
    "langparse/engines/pdf/deepdoc/ocr.py",
    "langparse/engines/pdf/deepdoc/recognizer.py",
    "langparse/engines/pdf/deepdoc/layout_recognizer.py",
    "langparse/engines/pdf/deepdoc/table_structure_recognizer.py",
    "langparse/engines/pdf/deepdoc/pdf_parser.py",
    "langparse/engines/pdf/deepdoc/utils.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
